<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Royal Blue to Emerald Teal -->
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="40%" stop-color="#1e3a8a" />
      <stop offset="75%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Coin Gold Gradient -->
    <linearGradient id="goldCoin4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Coin Silver/Platinum Gradient -->
    <linearGradient id="silverCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="80%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Growth Ribbon -->
    <linearGradient id="ribbonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020617" flood-opacity="0.6" />
    </filter>

    <filter id="dualGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad4)" filter="url(#shadow4)" />
  <rect x="17" y="17" width="478" height="478" rx="107" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />

  <!-- Inner Soft Radial Glow -->
  <circle cx="256" cy="240" r="150" fill="#3b82f6" opacity="0.15" />

  <!-- Dynamic Upward Growth Orbit / Ribbon -->
  <path d="M 100 320 C 120 400 392 410 412 310 C 432 210 320 120 220 110" 
        fill="none" 
        stroke="url(#ribbonGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        opacity="0.85" />

  <!-- Arrowhead on Growth Orbit -->
  <polygon points="210,110 238,95 232,125" fill="#38bdf8" />

  <!-- Coin 1 (Left / Back): Silver Riel Coin (៛) -->
  <g transform="translate(185, 245)">
    <circle cx="0" cy="0" r="76" fill="url(#silverCoin)" stroke="#f8fafc" stroke-width="4" />
    <circle cx="0" cy="0" r="66" fill="none" stroke="#475569" stroke-width="2" opacity="0.4" stroke-dasharray="6 4" />
    <!-- Khmer Riel Symbol (៛) -->
    <text x="0" y="24" font-family="'Kantumruy Pro', 'Khmer OS Battambang', 'Segoe UI', sans-serif" font-weight="900" font-size="70" fill="#1e293b" text-anchor="middle" style="text-shadow: 0 1px 2px rgba(255,255,255,0.8);">៛</text>
  </g>

  <!-- Coin 2 (Right / Front): Golden Dollar Coin ($) -->
  <g transform="translate(305, 275)" filter="url(#dualGlow)">
    <circle cx="0" cy="0" r="82" fill="url(#goldCoin4)" stroke="#fef08a" stroke-width="5" />
    <circle cx="0" cy="0" r="72" fill="none" stroke="#78350f" stroke-width="2" opacity="0.5" stroke-dasharray="6 4" />
    <!-- US Dollar Symbol ($) -->
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" fill="#ffffff" text-anchor="middle" style="text-shadow: 0 2px 4px rgba(0,0,0,0.3);">$</text>
  </g>

  <!-- Brand Signature "YSK FINANCE" Tag at Bottom -->
  <rect x="156" y="395" width="200" height="34" rx="17" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
  <text x="256" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#93c5fd" text-anchor="middle" letter-spacing="2">YSK FINANCE</text>

  <!-- Sparkles -->
  <polygon points="360,160 366,176 382,182 366,188 360,204 354,188 338,182 354,176" fill="#fde047" />
  <polygon points="120,200 124,210 134,214 124,218 120,228 116,218 106,214 116,210" fill="#67e8f9" />
</svg>