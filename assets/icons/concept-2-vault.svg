<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Midnight Sapphire) -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card 1 Gradient (Emerald / Teal) -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Card 2 Gradient (Royal Indigo) -->
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Wallet Leather/Surface Gradient -->
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="shadowVault" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="coinGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad2)" filter="url(#shadowVault)" />
  <rect x="17" y="17" width="478" height="478" rx="107" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Ambient Glow Behind Wallet -->
  <circle cx="256" cy="270" r="160" fill="#2563eb" opacity="0.25" filter="blur(40px)" />

  <!-- Background Credit Card (Tilted Emerald Card) -->
  <g transform="rotate(-12 256 220)">
    <rect x="145" y="125" width="220" height="135" rx="18" fill="url(#cardGrad1)" opacity="0.9" />
    <circle cx="180" cy="155" r="12" fill="#ffffff" opacity="0.3" />
    <rect x="250" y="150" width="90" height="8" rx="4" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Middle Credit Card (Tilted Sapphire Card) -->
  <g transform="rotate(6 256 230)">
    <rect x="150" y="135" width="220" height="135" rx="18" fill="url(#cardGrad2)" />
    <!-- Chip -->
    <rect x="175" y="160" width="30" height="24" rx="6" fill="#fde047" opacity="0.9" />
    <!-- Card Number lines -->
    <rect x="175" y="210" width="160" height="6" rx="3" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Main Front Premium Wallet Pouch -->
  <path d="M 90 230 C 90 210 106 195 126 195 L 386 195 C 406 195 422 210 422 230 L 422 360 C 422 385 402 405 377 405 L 135 405 C 110 405 90 385 90 360 Z"
        fill="url(#walletGrad)" />

  <!-- Wallet Front Flap / Pocket -->
  <path d="M 90 270 Q 256 310 422 270 L 422 360 C 422 385 402 405 377 405 L 135 405 C 110 405 90 385 90 360 Z"
        fill="#1e40af" opacity="0.85" />

  <!-- Wallet Seam Stitching Line -->
  <path d="M 105 240 L 407 240" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 4" opacity="0.5" />

  <!-- Central Golden Emblem / Medallion (YSK Family Wealth Crest) -->
  <g filter="url(#coinGlow)">
    <circle cx="256" cy="315" r="58" fill="url(#goldAcc)" stroke="#fef9c3" stroke-width="4" />
    <circle cx="256" cy="315" r="48" fill="none" stroke="#b45309" stroke-width="2" opacity="0.4" />
    
    <!-- YSK Monogram Crest -->
    <text x="256" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Kantumruy Pro', sans-serif" font-weight="900" font-size="28" fill="#78350f" text-anchor="middle" letter-spacing="1">YSK</text>
  </g>

  <!-- Golden Stars of Family Happiness -->
  <polygon points="256,75 264,95 285,95 268,107 274,127 256,115 238,127 244,107 227,95 248,95" fill="url(#goldAcc)" />
</svg>