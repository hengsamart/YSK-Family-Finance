<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Emerald Growth Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Shield Outline Glow -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.5" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#d97706" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Icon Squircle (iOS standard continuous curve R115 at 512x512) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad1)" filter="url(#shadowFilter)" />

  <!-- Inner Subtle Border -->
  <rect x="17" y="17" width="478" height="478" rx="107" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="2" />

  <!-- Diagonal Top Light Reflection -->
  <path d="M 24 124 C 24 68 68 24 124 24 L 388 24 C 444 24 488 68 488 124 L 488 180 C 340 180 180 240 24 380 Z" fill="url(#glassGloss)" />

  <!-- Security & Trust Shield (Family Protection) -->
  <path d="M 256 90 L 375 140 C 375 250 325 335 256 385 C 187 335 137 250 137 140 Z"
        fill="rgba(15, 23, 42, 0.42)" 
        stroke="url(#shieldBorder)" 
        stroke-width="5" 
        stroke-linejoin="round" />

  <!-- Inner Shield Glow Layer -->
  <path d="M 256 108 L 358 152 C 358 245 315 320 256 362 C 197 320 154 245 154 152 Z"
        fill="rgba(37, 99, 235, 0.25)" />

  <!-- Stylized Upward Financial Growth Ribbon / Rocket Chevron -->
  <!-- Ascending Bars / Growth Arrow -->
  <!-- Left Growth Bar -->
  <rect x="190" y="245" width="28" height="65" rx="14" fill="#60a5fa" opacity="0.85" />
  <!-- Center Growth Bar -->
  <rect x="232" y="205" width="28" height="105" rx="14" fill="#93c5fd" opacity="0.95" />
  <!-- Right Ascending Peak Bar -->
  <rect x="274" y="165" width="28" height="145" rx="14" fill="url(#emeraldGrad)" filter="url(#glowFilter)" />

  <!-- Dynamic Soaring Arrow Curve -->
  <path d="M 180 280 C 230 250 260 210 325 155" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <polygon points="340,145 312,148 328,168" fill="#34d399" />

  <!-- Floating Golden Wealth Coin with $ / ៛ Symbol -->
  <g filter="url(#goldGlow)">
    <circle cx="256" cy="360" r="54" fill="url(#goldCoin)" stroke="#fef08a" stroke-width="3" />
    <circle cx="256" cy="360" r="46" fill="none" stroke="#b45309" stroke-width="2" opacity="0.6" stroke-dasharray="4 3" />
    <!-- Monogram Y & Currency Mark -->
    <text x="256" y="377" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Kantumruy Pro', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" style="letter-spacing: -1px; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">$</text>
  </g>

  <!-- Sparkles of Prosperity -->
  <path d="M 380 110 Q 380 125 395 125 Q 380 125 380 140 Q 380 125 365 125 Q 380 125 380 110 Z" fill="#fde047" />
  <path d="M 130 220 Q 130 230 140 230 Q 130 230 130 240 Q 130 230 120 230 Q 130 230 130 220 Z" fill="#93c5fd" opacity="0.8" />
</svg>