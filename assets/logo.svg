  </text>
  <text x="83" y="58" font-family="'Kantumruy Pro', sans-serif" font-weight="600" font-size="12" fill="#64748b" letter-spacing="0.5">
    ប្រព័ន្ធគ្រប់គ្រងហិរញ្ញវត្ថុឆ្លាតវៃ
