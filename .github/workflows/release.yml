name: Auto Release on Version Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: YSK Family Finance ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
